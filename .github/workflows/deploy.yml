name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/shopm/backend

            git fetch origin main
            git reset --hard origin/main

            # Le venv de gunicorn (/var/www/shopm/venv), pour tout : dépendances,
            # migrations, fichiers statiques. L'ancien backend/venv venait d'un PC
            # de développement (versionné par erreur) et son pip était cassé.
            PY=/var/www/shopm/venv/bin/python
            $PY -m pip install -r requirements.txt --quiet
            $PY manage.py migrate --no-input
            $PY manage.py collectstatic --no-input

            sudo systemctl restart gunicorn

            # S'assurer que le script de backup est exécutable après git pull
            chmod +x scripts/backup-db.sh

            echo "✅ Backend déployé avec succès"
